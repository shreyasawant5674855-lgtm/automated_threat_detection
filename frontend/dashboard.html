<!DOCTYPE html>
<html>
<head>
    <title>Threat Monitoring Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Threat Monitoring Dashboard</h1>
        <p class="subtitle">Automated Network Threat Detection</p>

        <div class="card">
            <h2>System Status</h2>
            <p>🟢 System Active</p>
        </div>

        <div class="card">
            <h2>Network Traffic Detection</h2>

            <input type="number" id="bytes" placeholder="Bytes">
            <br><br>

            <input type="number" id="packets" placeholder="Packets">
            <br><br>

            <button onclick="checkThreat()">Check Traffic</button>

            <p id="result"></p>
        </div>

        <div class="card">
            <h2>Threat Summary</h2>
            <p>Detection system is connected to the AI backend.</p>
        </div>

    </div>

    <script>
        async function checkThreat() {

            const bytes = Number(document.getElementById("bytes").value);
            const packets = Number(document.getElementById("packets").value);

            const response = await fetch("http://127.0.0.1:5000/detect", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    bytes: bytes,
                    packets: packets
                })
            });

            const data = await response.json();

            document.getElementById("result").innerText =
                data.result;
        }
    </script>

</body>
</html>
