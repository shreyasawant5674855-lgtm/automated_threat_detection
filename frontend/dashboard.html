<!DOCTYPE html>
<html>
<head>
    <title>Threat Monitoring Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Threat Monitoring Dashboard</h1>
        <p class="subtitle">Automated Network Threat Detection</p>

        <div class="card">
            <h2>System Status</h2>
            <p>🟢 System Active</p>
        </div>

        <div class="card">
            <h2>Network Traffic Detection</h2>

            <input type="number" id="bytes" placeholder="Bytes" min="0">
            <br><br>

            <input type="number" id="packets" placeholder="Packets" min="0">
            <br><br>

            <button onclick="checkThreat()">Check Traffic</button>

            <p id="result"></p>
        </div>

        <div class="card">
            <h2>Threat Summary</h2>
            <p>Detection system is connected to the AI backend.</p>
        </div>

    </div>

    <script>
        async function checkThreat() {

            const bytesInput = document.getElementById("bytes").value;
            const packetsInput = document.getElementById("packets").value;
            const result = document.getElementById("result");

            // Check if fields are empty
            if (bytesInput === "" || packetsInput === "") {
                result.innerText = "Please enter both bytes and packets.";
                return;
            }

            const bytes = Number(bytesInput);
            const packets = Number(packetsInput);

            // Check for negative values
            if (bytes < 0 || packets < 0) {
                result.innerText = "Bytes and packets cannot be negative.";
                return;
            }

            try {
                const response = await fetch(
                    "https://automated-threat-detection.onrender.com/detect",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            bytes: bytes,
                            packets: packets
                        })
                    }
                );

                const data = await response.json();

                // Display API error
                if (!response.ok) {
                    result.innerText =
                        data.error || "Invalid input.";
                    return;
                }

                // Display prediction
                result.innerText = data.result;

            } catch (error) {
                result.innerText =
                    "Unable to connect to the server.";
            }
        }
    </script>

</body>
</html>
